name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # daily, to catch environment drift even when nothing is committed
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. A push to main and the nightly
# schedule are different runs of the same workflow on the same ref, so without
# the event in the key whichever starts second cancels the first. That happened
# on 2026-09-12: the nightly (cron says 04:00, GitHub actually started it at
# 08:16) cancelled a push's CI six minutes in, and because Release only follows
# a CI that CONCLUDED success, that push's Release was skipped - no failure
# anywhere, just no release for the commit. A push still supersedes an older
# push on the same ref, which is what cancel-in-progress is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  witness-level-a:
    # Level A is the fast gate: the native C reference records/verifies the
    # goldens, and the waterboxed core.wbx must reproduce them byte-for-byte
    # (including a per-frame whole-machine savestate pass). It needs only gcc,
    # python3 and meson - no .NET, Mono or X - so it runs on every push.
    # The full frontend gate (Level B) runs in parallel in witness-full below.
    name: witness level A (core equivalence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only the waterbox host/toolchain is needed here, not the frontend's
          # native dependencies (SDL2, OpenAL, ...)
          submodules: false

      - name: No network code
        # Chimera reaches for nothing over the network (docs/core-manager.md).
        # First and here because it needs nothing built: a source that names a
        # network API fails the push in seconds.
        run: ./tools/check-no-network.sh

      - name: The cores' release notes
        # tools/release-changes.py writes the "What changed" list on every
        # core's release page (issue 357); its own check needs nothing built
        run: python3 tools/release-changes.py --self-test

      - name: Check out miniBox
        run: git submodule update --init extern/chimera-common-minibox

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Build miniBox (host + guest toolchain)
        run: |
          meson setup extern/chimera-common-minibox/build/meson-linux extern/chimera-common-minibox
          meson compile -C extern/chimera-common-minibox/build/meson-linux

      - name: Build the waterboxed synth core (core.wbx) and its tester
        run: sh tests/synth/package-box/build-box.sh

      - name: Witness - Level A
        run: ./tests/synth/run-witness.sh --level a

      - name: Upload witness work dir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: witness-level-a-work
          path: tests/synth/work/

  witness-full:
    # The full gate, including Level B: Chimera's window runs headless (no
    # display), loads the core.wbx package through Chimera's built-in generic
    # waterbox adapter, replays the movies, and the RAM/VRAM dumps must be
    # byte-identical to the Level A goldens - in both simple and rerecord
    # (per-frame whole-machine savestate) modes.
    #
    # This builds the entire frontend: every native dependency (SDL2, OpenAL,
    # zstd, cimgui, lua, sqlite3) and the window on Qt 6.12, so it takes
    # minutes rather than seconds. It still runs per push - the level A job
    # above gives fast feedback meanwhile - and on a daily schedule, which
    # catches environment drift (toolchain/runner image changes) with no commit.
    name: witness levels A+B (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # only what the frontend is built from; the cores are separate
          # repositories now and this job never opens one (see published-cores)
          submodules: false

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window; installs into build/dll)
        run: ./tools/ci-chimera.sh "$HOME/qt"

      - name: Build miniBox's guest toolchain and the waterboxed synth core package
        run: |
          mb=extern/chimera-common-minibox
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          sh tests/synth/package-box/build-box.sh
          ./tests/synth/build-package.sh

      - name: Unit tests (the engine, the view models, the window)
        run: meson test -C build/meson-linux --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-linux/meson-logs/

      - name: Witness - Levels A and B
        run: ./tests/synth/run-witness.sh

      - name: Upload witness work dir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: witness-full-work
          path: tests/synth/work/

  published-cores:
    # The cores as they are actually published. Chimera ships none and builds
    # none, so nothing else here would notice a frontend change that broke the
    # generic waterbox adapter for every core at once - it would surface the
    # first time somebody downloaded one.
    #
    # So: fetch what each core last published and check the CONTRACT against it.
    # No rom, no firmware, no emulation and no core build - that a package can be
    # read, understood and turned into a working factory. Whether the emulation
    # is still right is each core repository's own gate, which runs against this
    # repository's main and is the same check from the other side.
    #
    # A core that has published nothing is skipped, not a failure: the cores gain
    # their release pipeline one at a time. Note what that means when NOTHING is
    # fetched - every test is inconclusive and the job goes green having checked
    # nothing at all, which is exactly what hid this job needing the engine until
    # the first real packages arrived. The step below fails the job if the fetch
    # produced no packages, so a silent nothing cannot pass again.
    name: published cores (package contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (reading a package is the engine's; the contract test is the window's)
        run: ./tools/ci-chimera.sh "$HOME/qt"

      - name: Fetch every published core package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/fetch-cores.sh

      - name: What was fetched
        # All fifteen cores publish, so an empty build/Cores means the fetch
        # broke, not that the cores are young. Passing on nothing is how this job
        # spent its first day validating nothing.
        run: |
          ls -la build/Cores || true
          count=$(find build/Cores -name '*.chimeraCore' 2>/dev/null | wc -l)
          echo "$count package(s) fetched"
          [ "$count" -gt 0 ] || { echo "::error::no core packages were fetched; there is nothing to check" >&2; exit 1; }

      - name: The frontend against real packages
        run: build/meson-linux/source/ui/test-packages build/Cores
