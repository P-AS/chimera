# Cross file for the Qt window's Windows build (source/ui): like
# mingw-w64.ini, but with the compiler's "posix" thread model Qt needs, and
# the C++ runtime as DLLs (libstdc++-6, libgcc_s_seh-1, libwinpthread-1)
# shared with Qt's, rather than a copy linked into each program.
#
#   meson setup build/meson-windows-qt --prefix "$PWD/build/qt-windows" --libdir dll \
#       --cross-file extern/meson/mingw-w64-qt.ini -Dqt_ui=enabled
#
# with pkg-config pointed at the Windows Qt (a second cross file setting
# [properties] pkg_config_libdir), and the Linux Qt's libexec on PATH for moc.

[binaries]
c = 'x86_64-w64-mingw32-gcc-posix'
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
